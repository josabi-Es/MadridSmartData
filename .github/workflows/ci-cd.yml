name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for breaking change
        id: check
        run: |
          msg="$(git log -1 --pretty=%B)"
          if echo "$msg" | grep -qE '^[a-z]+(\([^)]+\))?!:' || echo "$msg" | grep -q 'BREAKING CHANGE:'; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create next release branch
        if: steps.check.outputs.breaking == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin 'refs/heads/release-v*:refs/remotes/origin/release-v*'
          last=$(git branch -r --list 'origin/release-v*' | sed 's#.*release-v##' | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          git checkout -b "release-v${next}"
          git push origin "release-v${next}"
