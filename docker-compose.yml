services:
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-madrid
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: "50000"
      PYTHONPATH: /opt/repo
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    volumes:
      - airflow_home:/opt/airflow
      - .:/opt/repo
      - ./airflow/dags:/opt/airflow/dags
    command: >
      bash -c "airflow db init &&
      (airflow users create --username $$AIRFLOW_ADMIN_USER --password $$AIRFLOW_ADMIN_PASSWORD --firstname Air --lastname Flow --role Admin --email admin@example.com || true) &&
      airflow standalone"

volumes:
  airflow_home:
