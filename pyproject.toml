[project]
name = "madridsmartdata"
version = "0.1.0"
description = "Madrid open data pipeline: air quality + traffic, ingest to forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "duckdb>=1.5.0",
    "folium>=0.20.0",
    "geopandas==1.0.1",
    "fastapi<0.116",
    "gradio==4.44.1",
    "huggingface_hub<1.0",
    "matplotlib==3.9.4",
    "pyarrow>=24.0.0",
    "shapely==2.0.7",
]

# ingest (CKAN API) + training -- not imported by src/dashboard, so a
# frontend-only install (`uv sync`) skips them.
[project.optional-dependencies]
pipeline = [
    "requests>=2.31.0",
    "scikit-learn>=1.5.0",
    "xgboost>=3.2.0",
    "joblib>=1.5.3",
    "papermill>=2.6.0",
    "ipykernel>=6.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]

# Legacy Spark code, replaced by src/data/{ingest,transform} in a later phase.
[tool.ruff.lint.per-file-ignores]
"src/old_ingest/**" = ["E501", "N802", "N806", "N816"]
"src/old_preprocessing/**" = ["E501", "N802", "N806", "N816"]
# Dashboard: long lines from UI literals (color tables, folium markup).
"src/dashboard/**" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
